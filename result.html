<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Result &mdash; GATE CE Mock Test</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/result.css">
</head>
<body>
<div id="result-root">
  <header class="site-header">
    <div class="site-header-inner">
      <a href="index.html" class="site-logo">
        <span class="logo-icon">📚</span>
        <h1>GATE CE</h1>
      </a>
      <nav class="site-nav">
        <a href="index.html"   class="site-nav-link">Mock Tests</a>
        <a href="practice.html" class="site-nav-link site-nav-link--practice">⚡ Practice</a>
        <a href="profile.html"  class="site-nav-link">Progress</a>
      </nav>
    </div>
  </header>

  <main class="result-main">
    <section class="scorecard">
      <div class="score-tile">
        <div class="score-tile-value" id="total-score">0</div>
        <div class="score-tile-label">Total Score</div>
      </div>
      <div class="score-tile">
        <div class="score-tile-value" id="correct-count">0</div>
        <div class="score-tile-label">Correct</div>
      </div>
      <div class="score-tile">
        <div class="score-tile-value" id="wrong-count">0</div>
        <div class="score-tile-label">Wrong</div>
      </div>
      <div class="score-tile">
        <div class="score-tile-value" id="unattempted-count">0</div>
        <div class="score-tile-label">Unattempted</div>
      </div>
    </section>

    <section class="section-breakdown-block">
      <h2>Section-wise Breakdown</h2>
      <table>
        <tbody id="section-breakdown"></tbody>
      </table>
    </section>

    <section class="answer-review-block">
      <h2>Answer Key Review</h2>
      <div id="answer-review"></div>
    </section>

    <div class="result-actions">
      <a href="profile.html" class="primary-btn">View Progress &amp; Profile</a>
      <button type="button" id="download-backup-btn" class="secondary-btn" style="display:inline-flex;align-items:center;gap:6px;">
        💾 Download Backup (JSON)
      </button>
      <a href="index.html" class="secondary-btn">Back to years</a>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/manifest.js"></script>
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="data/2015.js"></script>
<script src="data/2017_ce1.js"></script>
<script src="data/2017_ce2.js"></script>
<script src="data/2018_ce1.js"></script>
<script src="data/2018_ce2.js"></script>
<script src="data/2019_ce1.js"></script>
<script src="data/2019_ce2.js"></script>
<script src="data/2020_ce1.js"></script>
<script src="data/2020_ce2.js"></script>
<script src="data/2021_ce1.js"></script>
<script src="data/2021_ce2.js"></script>
<script src="data/2022.js"></script>
<script src="data/2023.js"></script>
<script src="data/2024.js"></script>
<script src="data/2025_ce1.js"></script>
<script src="data/2025_ce2.js"></script>
<script src="js/profile.js"></script>
<script src="js/onboarding.js"></script>
<script src="js/result-page.js"></script>
</body>
</html>
